apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgresql
  name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - image: postgres:14.2
          name: db
          env:
           - name: POSTGRES_PASSWORD
             valueFrom:
               secretKeyRef:
                name: demo-secret
                key: password
          ports:
           - containerPort: 5432
   
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-claim